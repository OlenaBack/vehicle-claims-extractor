timeout_seconds = 300
max_retries = 2
max_tokens = 800

[models.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openai/gpt-4o-mini"
price_per_1m = [0.15, 0.60] # USD per 1M input and output tokens; verify before reporting.

[models.ollama]
base_url = "http://localhost:11434/v1"
model = "llama3.2:3b"
price_per_1m = [0, 0] # Local model: no API cost.

[sampling.deterministic]
temperature = 0.0
top_p = 1.0

[sampling.varied]
temperature = 0.7
top_p = 0.9
